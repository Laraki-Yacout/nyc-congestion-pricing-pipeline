name: Data pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["exports/**", "powerbi/**", "docs/**", "**.md"]
  pull_request:
  schedule:
    # 20th of every month at 06:17 UTC: the TLC usually publishes a new month by then
    - cron: "17 6 20 * *"
  workflow_dispatch:

jobs:
  test:
    name: Smoke test on synthetic data
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_pipeline.py --sample

  refresh:
    name: Refresh with the real TLC data
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: refresh
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Keep the monthly files between runs so only new months are downloaded
      - name: Restore raw files from previous runs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: tlc-raw-${{ github.run_id }}
          restore-keys: tlc-raw-

      - name: Run the pipeline
        run: python scripts/run_pipeline.py --memory 10GB

      - name: Publish the exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports
          if git diff --cached --quiet; then
            echo "No change in the exports"
            exit 0
          fi
          git commit -m "Refresh exports (data up to $(jq -r .last_month exports/summary.json))"
          git push

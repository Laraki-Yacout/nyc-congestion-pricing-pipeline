name: nyc_congestion
version: "1.0.0"
config-version: 2
profile: nyc_congestion

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

flags:
  send_anonymous_usage_stats: false

vars:
  # Folder that holds taxi_zone_lookup.csv and yellow/*.parquet (set by scripts/run_pipeline.py)
  raw_dir: "../data/raw"
  # Congestion pricing started on Sunday 5 January 2025 at midnight
  toll_start: "2025-01-05"
  # Control group used for the headline estimate. Chosen because it is the one that passes
  # the placebo test (2024 vs 2023) and its trips are as short as trips inside the zone.
  main_control: "outside the zone, trips under 3 miles"

models:
  nyc_congestion:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
